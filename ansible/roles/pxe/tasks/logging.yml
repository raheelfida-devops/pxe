---
- name: Ensure log writer account exists for rsyslog privilege dropping
  ansible.builtin.user:
    name: syslog
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create central PXE log with restricted permissions
  ansible.builtin.file:
    path: '{{ pxe_log_file }}'
    state: touch
    owner: syslog
    group: adm
    mode: '0640'
    access_time: preserve
    modification_time: preserve

- name: Forward journal service output to syslog
  ansible.builtin.template:
    src: journald-pxe.conf.j2
    dest: /etc/systemd/journald.conf.d/60-pxe.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart journald

- name: Collect PXE runtime records in the central log
  ansible.builtin.template:
    src: rsyslog-pxe.conf.j2
    dest: /etc/rsyslog.d/30-pxe.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart rsyslog

- name: Validate effective rsyslog configuration before service changes
  ansible.builtin.command:
    argv:
      - /usr/sbin/rsyslogd
      - -N1
  changed_when: false
  when: not ansible_check_mode

- name: Rotate central PXE log daily
  ansible.builtin.template:
    src: logrotate-pxe.j2
    dest: /etc/logrotate.d/pxe
    owner: root
    group: root
    mode: '0644'
    backup: true

- name: Enable central syslog collector
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: started
